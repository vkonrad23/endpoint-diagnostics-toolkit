services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes: [".:/app"]
    ports: ["8000:8000"]
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0"
  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes: [".:/app"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
