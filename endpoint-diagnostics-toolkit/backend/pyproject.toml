[project]
name="edst-backend"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115","uvicorn>=0.30","pydantic-settings>=2.5","sqlalchemy>=2.0","psutil>=6.0"]
[project.optional-dependencies]
dev=["pytest>=8","httpx>=0.27","ruff>=0.6"]
